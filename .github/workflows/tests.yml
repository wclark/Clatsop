name: tests

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests benchmarks

      - name: Lint
        run: ruff check src tests benchmarks

      - name: Format check
        run: ruff format --check src tests benchmarks

      - name: Type check
        run: pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run tests with coverage
        run: pytest --cov=clatsop --cov-report=term-missing

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install package
        run: python -m pip install -e ".[test]"

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: pytest

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Build wheel and source distribution
        run: |
          python -m pip install build
          python -m build

      - name: Install and smoke-test the wheel
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "from clatsop import Ruleset, Turn; assert len(Ruleset.american()) == 366; assert len(Ruleset.american().successors(Turn.initial())) == 7"
          python -m pip check

  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"

      - name: Install notebook dependencies
        run: python -m pip install -e ".[notebook]"

      - name: Execute notebooks
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p .notebook-build
          jupyter nbconvert --execute --to notebook --ExecutePreprocessor.timeout=600 --output-dir=.notebook-build notebooks/clatsop_examples.ipynb notebooks/clatsop_rule_catalog.ipynb

      - name: Upload executed notebooks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: executed-notebooks
          path: .notebook-build/
